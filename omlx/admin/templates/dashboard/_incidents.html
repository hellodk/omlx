<div x-show="mainTab === 'incidents'" x-cloak data-incidents-view>
    <div class="animate-fade-in-up">
        <!-- Service health is its own surface, not a cluster side panel.
             Everything here reads from the same server-owned stores the
             cluster tab used; only the address changed. -->
        <div class="mb-6">
            <h2 class="text-2xl font-bold tracking-tight text-neutral-900">Service health &amp; incidents</h2>
            <p class="text-sm text-neutral-500 mt-2 max-w-2xl">
                Objectives, error budgets, and server-owned incident records.
                Available on every host — no distributed inference required.
            </p>
        </div>

        <!-- SLO Status Cards -->
        <div x-show="clusterSlos && clusterSlos.slos && clusterSlos.slos.length" x-cloak class="mb-6">
            <div class="flex items-center gap-2 mb-3">
                <i data-lucide="gauge" class="w-4 h-4 text-neutral-500"></i>
                <h3 class="text-sm font-semibold text-neutral-900">Service Level Objectives</h3>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider"
                      :class="{
                          'bg-green-50 text-green-700': clusterSlos.overall_status === 'healthy',
                          'bg-amber-50 text-amber-700': clusterSlos.overall_status === 'degraded',
                          'bg-red-50 text-red-700': clusterSlos.overall_status === 'breached'
                      }"
                      x-text="clusterSlos.overall_status"></span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                <template x-for="slo in (clusterSlos.slos || [])" :key="slo.name">
                    <div class="rounded-xl border p-3 transition-colors"
                         :class="{
                             'border-green-200 bg-green-50': slo.status === 'healthy',
                             'border-amber-200 bg-amber-50': slo.status === 'degraded',
                             'border-red-200 bg-red-50': slo.status === 'breached'
                         }">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-[10px] font-semibold uppercase tracking-wider"
                                  :class="{
                                      'text-green-700': slo.status === 'healthy',
                                      'text-amber-700': slo.status === 'degraded',
                                      'text-red-700': slo.status === 'breached'
                                  }"
                                  x-text="slo.status"></span>
                            <span class="text-[10px] font-mono text-neutral-400" x-text="slo.metric_kind"></span>
                        </div>
                        <div class="text-xs font-semibold text-neutral-900 mb-0.5" x-text="slo.description || slo.name"></div>
                        <div class="flex items-baseline gap-1.5 mt-1.5">
                            <span class="text-lg font-bold tabular-nums"
                                  :class="{
                                      'text-green-700': slo.status === 'healthy',
                                      'text-amber-700': slo.status === 'degraded',
                                      'text-red-700': slo.status === 'breached'
                                  }"
                                  x-text="slo.compliance_pct + '%'"></span>
                            <span class="text-[10px] text-neutral-400">compliance</span>
                        </div>
                        <div class="mt-1.5 flex items-center gap-3 text-[10px] text-neutral-500">
                            <span>Burn rate: <span class="font-semibold tabular-nums" x-text="slo.burn_rate.toFixed(2) + 'x'"></span></span>
                            <span x-show="slo.time_to_breach_seconds != null">
                                Breach in: <span class="font-semibold" x-text="slo.time_to_breach_seconds < 3600 ? Math.round(slo.time_to_breach_seconds / 60) + 'm' : Math.round(slo.time_to_breach_seconds / 3600) + 'h'"></span>
                            </span>
                        </div>
                        <div class="mt-1 text-[10px] text-neutral-400 font-mono" x-show="slo.current_value != null">
                            Current: <span x-text="slo.current_value"></span> / Target: <span x-text="slo.target"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Error Budget -->
        <div x-show="clusterErrorBudget && clusterErrorBudget.slos && clusterErrorBudget.slos.length" x-cloak class="mb-6">
            <div class="flex items-center gap-2 mb-3">
                <i data-lucide="battery-medium" class="w-4 h-4 text-neutral-500"></i>
                <h3 class="text-sm font-semibold text-neutral-900">Error Budget</h3>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider"
                      :class="clusterErrorBudget.can_deploy
                          ? 'bg-green-50 text-green-700'
                          : 'bg-red-50 text-red-700'"
                      x-text="clusterErrorBudget.can_deploy ? 'deploy allowed' : 'deploy blocked'"></span>
            </div>
            <div x-show="(clusterErrorBudget.blocking_slos || []).length"
                 class="mb-3 rounded-xl border border-red-200 bg-red-50 px-4 py-2.5 text-xs text-red-800">
                Blocked by:
                <span class="font-semibold" x-text="(clusterErrorBudget.blocking_slos || []).join(', ')"></span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                <template x-for="budget in (clusterErrorBudget.slos || [])" :key="budget.slo_name">
                    <div class="rounded-xl border p-3 transition-colors"
                         :class="{
                             'border-green-200 bg-green-50': budget.budget_remaining_pct >= 50,
                             'border-amber-200 bg-amber-50': budget.budget_remaining_pct >= 10 && budget.budget_remaining_pct < 50,
                             'border-red-200 bg-red-50': budget.budget_remaining_pct < 10
                         }">
                        <div class="text-xs font-semibold text-neutral-900 mb-1.5" x-text="budget.slo_name"></div>
                        <div class="flex items-baseline gap-1.5">
                            <span class="text-lg font-bold tabular-nums"
                                  :class="{
                                      'text-green-700': budget.budget_remaining_pct >= 50,
                                      'text-amber-700': budget.budget_remaining_pct >= 10 && budget.budget_remaining_pct < 50,
                                      'text-red-700': budget.budget_remaining_pct < 10
                                  }"
                                  x-text="budget.budget_remaining_pct.toFixed(1) + '%'"></span>
                            <span class="text-[10px] text-neutral-500">budget left</span>
                        </div>
                        <div class="mt-1.5 flex items-center gap-3 text-[10px] text-neutral-600">
                            <span>Burn: <span class="font-semibold tabular-nums" x-text="budget.consumption_rate.toFixed(2) + 'x'"></span></span>
                            <span x-show="budget.time_to_exhaustion_hours != null">
                                Empty in:
                                <span class="font-semibold"
                                      x-text="budget.time_to_exhaustion_hours < 1
                                          ? Math.round(budget.time_to_exhaustion_hours * 60) + 'm'
                                          : Math.round(budget.time_to_exhaustion_hours) + 'h'"></span>
                            </span>
                        </div>
                        <div class="mt-1 text-[10px] text-neutral-500 font-mono"
                             x-text="budget.sample_count + ' samples / ' + Math.round(budget.window_seconds / 3600) + 'h window'"></div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Server-owned incident feed. Polls merge into this list and never
             delete: the badge and rows survive browser reloads because the
             records live on the coordinator, not in component state. -->
        <details x-show="clusterActiveIncidents().length" x-cloak
                 class="mb-6 rounded-xl border border-amber-200 bg-amber-50 overflow-hidden" open>
            <summary class="flex items-center gap-2 px-4 py-2.5 text-sm text-amber-800 cursor-pointer select-none">
                <i data-lucide="bell-ring" class="w-4 h-4 flex-shrink-0"></i>
                <span class="font-semibold">Cluster incidents</span>
                <span class="inline-flex items-center justify-center min-w-[1.25rem] h-5 px-1.5 rounded-full bg-amber-500 text-white text-[10px] font-bold"
                      x-text="clusterActiveIncidents().length"></span>
            </summary>
            <ul class="border-t border-amber-200 divide-y divide-amber-100 max-h-72 overflow-y-auto">
                <template x-for="incident in clusterActiveIncidents()" :key="incident.id">
                    <li class="flex items-start gap-2.5 px-4 py-2.5 text-xs">
                        <span class="mt-1 w-2 h-2 rounded-full flex-shrink-0"
                              :class="{
                                  'bg-red-500': incident.severity === 'error',
                                  'bg-amber-500': incident.severity === 'warn',
                                  'bg-neutral-400': incident.severity === 'info'
                              }"></span>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2 text-[10px] text-amber-800">
                                <span class="font-semibold uppercase tracking-wider" x-text="incident.severity"></span>
                                <span class="font-mono" x-text="incident.source"></span>
                                <span x-text="clusterIncidentAge(incident.ts)"></span>
                                <span x-show="incident.superseded_by" class="italic">superseded</span>
                            </div>
                            <div class="text-amber-900 mt-0.5 break-words" x-text="incident.message"></div>
                        </div>
                        <button type="button"
                                @click="dismissClusterIncident(incident.id)"
                                class="px-2 py-1 text-[10px] font-medium text-amber-800 border border-amber-300 rounded-md hover:bg-amber-100 flex-shrink-0">
                            Dismiss
                        </button>
                    </li>
                </template>
            </ul>
        </details>
    </div>
</div>
